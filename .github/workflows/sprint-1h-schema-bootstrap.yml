name: Sprint 1H Schema Bootstrap

on:
  push:
    branches:
      - feature/sprint-1h-pdf-registry-citation-retrieval

permissions:
  contents: write

jobs:
  patch-schema:
    if: ${{ !contains(github.event.head_commit.message, 'chore(pdf): apply Sprint 1H schema') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sprint-1h-pdf-registry-citation-retrieval

      - name: Add PDF registry schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('convex/schema.ts')
          text = path.read_text()
          marker = '  sourceSyncRuns: defineTable({'
          if '  pdfDocuments: defineTable({' not in text:
              block = r'''  pdfDocuments: defineTable({
    ownerUserId: v.optional(v.id("users")),
    title: v.string(),
    fileName: v.string(),
    mimeType: v.literal("application/pdf"),
    byteLength: v.number(),
    checksumSha256: v.string(),
    storageId: v.optional(v.id("_storage")),
    visibility: v.union(
      v.literal("private"),
      v.literal("premium"),
      v.literal("public"),
    ),
    lifecycle: v.union(
      v.literal("registered"),
      v.literal("processing"),
      v.literal("ready"),
      v.literal("failed"),
      v.literal("quarantined"),
      v.literal("archived"),
    ),
    sourceUrl: v.optional(v.string()),
    pageCount: v.optional(v.number()),
    activeVersion: v.number(),
    parentDocumentId: v.optional(v.id("pdfDocuments")),
    createdAt: v.number(),
    updatedAt: v.number(),
    processedAt: v.optional(v.number()),
    quarantineReason: v.optional(v.string()),
  })
    .index("by_ownerUserId_and_createdAt", ["ownerUserId", "createdAt"])
    .index("by_checksumSha256", ["checksumSha256"])
    .index("by_visibility_and_lifecycle", ["visibility", "lifecycle"])
    .index("by_lifecycle_and_updatedAt", ["lifecycle", "updatedAt"])
    .index("by_parentDocumentId_and_activeVersion", [
      "parentDocumentId",
      "activeVersion",
    ]),

  pdfProcessingJobs: defineTable({
    documentId: v.id("pdfDocuments"),
    requestedBy: v.optional(v.id("users")),
    attempt: v.number(),
    status: v.union(
      v.literal("queued"),
      v.literal("running"),
      v.literal("completed"),
      v.literal("failed"),
      v.literal("quarantined"),
      v.literal("cancelled"),
    ),
    stage: v.union(
      v.literal("register"),
      v.literal("extract"),
      v.literal("chunk"),
      v.literal("index"),
    ),
    errorCode: v.optional(v.string()),
    errorMessage: v.optional(v.string()),
    createdAt: v.number(),
    startedAt: v.optional(v.number()),
    completedAt: v.optional(v.number()),
  })
    .index("by_documentId_and_createdAt", ["documentId", "createdAt"])
    .index("by_status_and_createdAt", ["status", "createdAt"])
    .index("by_createdAt", ["createdAt"]),

  pdfPages: defineTable({
    documentId: v.id("pdfDocuments"),
    pageNumber: v.number(),
    text: v.string(),
    textHash: v.string(),
    charCount: v.number(),
    createdAt: v.number(),
  })
    .index("by_documentId_and_pageNumber", ["documentId", "pageNumber"])
    .index("by_documentId_and_createdAt", ["documentId", "createdAt"]),

  pdfChunks: defineTable({
    documentId: v.id("pdfDocuments"),
    pageId: v.id("pdfPages"),
    ownerUserId: v.optional(v.id("users")),
    visibility: v.union(
      v.literal("private"),
      v.literal("premium"),
      v.literal("public"),
    ),
    documentLifecycle: v.union(
      v.literal("processing"),
      v.literal("ready"),
    ),
    pageNumber: v.number(),
    chunkIndex: v.number(),
    text: v.string(),
    textHash: v.string(),
    charStart: v.number(),
    charEnd: v.number(),
    citationLabel: v.string(),
    createdAt: v.number(),
  })
    .index("by_documentId_and_chunkIndex", ["documentId", "chunkIndex"])
    .index("by_documentId_and_pageNumber", ["documentId", "pageNumber"])
    .searchIndex("search_text", {
      searchField: "text",
      filterFields: ["visibility", "ownerUserId", "documentLifecycle"],
    }),

  pdfRetrievalLogs: defineTable({
    userId: v.optional(v.id("users")),
    queryHash: v.string(),
    resultCount: v.number(),
    createdAt: v.number(),
  })
    .index("by_userId_and_createdAt", ["userId", "createdAt"])
    .index("by_createdAt", ["createdAt"]),

'''
              text = text.replace(marker, block + marker, 1)
              path.write_text(text)
          PY

      - name: Remove bootstrap workflow and commit
        run: |
          git rm .github/workflows/sprint-1h-schema-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/schema.ts
          git commit -m "chore(pdf): apply Sprint 1H schema"
          git push
