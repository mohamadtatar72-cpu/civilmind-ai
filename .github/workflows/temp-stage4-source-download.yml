name: Temporary Stage 4 source download
on:
  pull_request:
    branches:
      - develop/civilmind-v2
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download official INBR PDFs
        run: |
          mkdir -p stage4-official
          curl -L --fail --retry 3 'https://inbr.ir/upload/azmoon1400/mohandes-omran-nezarat.pdf' -o stage4-official/mordad-1400.pdf
          curl -L --fail --retry 3 'https://inbr.ir/upload/azmoon-day-1401/%D8%B9%D9%85%D8%B1%D8%A7%D9%86%20%D9%86%D8%B8%D8%A7%D8%B1%D8%AA%20-%20%D8%AF%DB%8C%20%D9%85%D8%A7%D9%87%201401.pdf' -o stage4-official/dey-1401.pdf
          curl -L --fail --retry 3 'https://inbr.ir/wp-content/uploads/2023/06/omran-nezarat-1402-02.pdf' -o stage4-official/ordibehesht-1402.pdf
          file stage4-official/*.pdf
      - name: Upload official PDFs
        uses: actions/upload-artifact@v4
        with:
          name: official-stage4-sources
          path: stage4-official/*.pdf
          retention-days: 1
