name: CivilMind CI

on:
  pull_request:
    branches:
      - develop/civilmind-v2
  push:
    branches:
      - develop/civilmind-v2
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: civilmind-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_AGENT_MODE: anonymous
      CLERK_JWT_ISSUER_DOMAIN: https://ci.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Convex functions
        run: npx convex dev --once

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
