name: CivilMind CI

on:
  pull_request:
    branches:
      - develop/civilmind-v2
  push:
    branches:
      - "feature/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_AGENT_MODE: anonymous

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare fail-closed CI authentication config
        run: |
          cat > convex/auth.config.ts <<'EOF'
          import type { AuthConfig } from "convex/server";

          export default {
            providers: [
              {
                domain: "https://clerk-not-configured.invalid",
                applicationID: "convex",
              },
            ],
          } satisfies AuthConfig;
          EOF

      - name: Generate and validate Convex functions
        run: npx convex dev --once

      - name: Commit tested generated Convex API
        if: >-
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'chore: refresh Sprint 1D generated API')
        run: |
          git checkout -- convex/auth.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/_generated
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "chore: refresh Sprint 1D generated API"
            git push
          fi

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
