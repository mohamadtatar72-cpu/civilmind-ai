name: CivilMind CI

on:
  pull_request:
    branches:
      - develop/civilmind-v2
  push:
    branches:
      - "feature/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_AGENT_MODE: anonymous

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/sprint-1h-pdf-registry-citation-retrieval

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Sprint 1H PDF schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('convex/schema.ts')
          text = path.read_text()
          marker = '  sourceSyncRuns: defineTable({'
          if '  pdfDocuments: defineTable({' not in text:
              block = '''  pdfDocuments: defineTable({
    ownerUserId: v.optional(v.id("users")),
    title: v.string(),
    fileName: v.string(),
    mimeType: v.literal("application/pdf"),
    byteLength: v.number(),
    checksumSha256: v.string(),
    storageId: v.optional(v.id("_storage")),
    visibility: v.union(v.literal("private"), v.literal("premium"), v.literal("public")),
    lifecycle: v.union(v.literal("registered"), v.literal("processing"), v.literal("ready"), v.literal("failed"), v.literal("quarantined"), v.literal("archived")),
    sourceUrl: v.optional(v.string()),
    pageCount: v.optional(v.number()),
    activeVersion: v.number(),
    parentDocumentId: v.optional(v.id("pdfDocuments")),
    createdAt: v.number(),
    updatedAt: v.number(),
    processedAt: v.optional(v.number()),
    quarantineReason: v.optional(v.string()),
  })
    .index("by_ownerUserId_and_createdAt", ["ownerUserId", "createdAt"])
    .index("by_checksumSha256", ["checksumSha256"])
    .index("by_visibility_and_lifecycle", ["visibility", "lifecycle"])
    .index("by_lifecycle_and_updatedAt", ["lifecycle", "updatedAt"])
    .index("by_parentDocumentId_and_activeVersion", ["parentDocumentId", "activeVersion"]),

  pdfProcessingJobs: defineTable({
    documentId: v.id("pdfDocuments"),
    requestedBy: v.optional(v.id("users")),
    attempt: v.number(),
    status: v.union(v.literal("queued"), v.literal("running"), v.literal("completed"), v.literal("failed"), v.literal("quarantined"), v.literal("cancelled")),
    stage: v.union(v.literal("register"), v.literal("extract"), v.literal("chunk"), v.literal("index")),
    errorCode: v.optional(v.string()),
    errorMessage: v.optional(v.string()),
    createdAt: v.number(),
    startedAt: v.optional(v.number()),
    completedAt: v.optional(v.number()),
  })
    .index("by_documentId_and_createdAt", ["documentId", "createdAt"])
    .index("by_status_and_createdAt", ["status", "createdAt"])
    .index("by_createdAt", ["createdAt"]),

  pdfPages: defineTable({
    documentId: v.id("pdfDocuments"),
    pageNumber: v.number(),
    text: v.string(),
    textHash: v.string(),
    charCount: v.number(),
    createdAt: v.number(),
  })
    .index("by_documentId_and_pageNumber", ["documentId", "pageNumber"])
    .index("by_documentId_and_createdAt", ["documentId", "createdAt"]),

  pdfChunks: defineTable({
    documentId: v.id("pdfDocuments"),
    pageId: v.id("pdfPages"),
    ownerUserId: v.optional(v.id("users")),
    visibility: v.union(v.literal("private"), v.literal("premium"), v.literal("public")),
    documentLifecycle: v.union(v.literal("processing"), v.literal("ready")),
    pageNumber: v.number(),
    chunkIndex: v.number(),
    text: v.string(),
    textHash: v.string(),
    charStart: v.number(),
    charEnd: v.number(),
    citationLabel: v.string(),
    createdAt: v.number(),
  })
    .index("by_documentId_and_chunkIndex", ["documentId", "chunkIndex"])
    .index("by_documentId_and_pageNumber", ["documentId", "pageNumber"])
    .searchIndex("search_text", { searchField: "text", filterFields: ["visibility", "ownerUserId", "documentLifecycle"] }),

  pdfRetrievalLogs: defineTable({
    userId: v.optional(v.id("users")),
    queryHash: v.string(),
    resultCount: v.number(),
    createdAt: v.number(),
  })
    .index("by_userId_and_createdAt", ["userId", "createdAt"])
    .index("by_createdAt", ["createdAt"]),

'''
              if marker not in text:
                  raise SystemExit('schema marker missing')
              path.write_text(text.replace(marker, block + marker, 1))
          PY

      - name: Prepare fail-closed CI authentication config
        run: |
          cat > convex/auth.config.ts <<'EOF'
          import type { AuthConfig } from "convex/server";
          export default { providers: [{ domain: "https://clerk-not-configured.invalid", applicationID: "convex" }] } satisfies AuthConfig;
          EOF

      - name: Generate and validate Convex functions
        run: npx convex dev --once

      - name: Commit schema and generated API
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(pdf): persist schema and codegen')
        run: |
          git checkout -- convex/auth.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/schema.ts convex/_generated
          if ! git diff --cached --quiet; then
            git commit -m "chore(pdf): persist schema and codegen"
            git push origin HEAD:feature/sprint-1h-pdf-registry-citation-retrieval
          fi

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
